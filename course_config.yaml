# ============================================================
# Claude Code Mastery (CCM) - Course Configuration
# ============================================================
# Machine-readable source of truth for the entire course.
# All module definitions, weights, dependencies, and system
# integration mappings live here.
# ============================================================

course:
  name: "Claude Code Mastery"
  short_name: "CCM"
  version: "1.0.0"
  created: "2026-02-27"
  author: "JayBrain"
  description: >
    Complete mastery curriculum for Claude Code CLI.
    27 modules across 5 tiers covering every feature,
    configuration pattern, and advanced architecture.
  target_audience: "Developers and power users seeking full Claude Code expertise"
  estimated_hours: 40-60

# -- SynapseForge Integration --
forge:
  subject_id: "dd261837f042"
  pass_score: 0.95
  mastery_levels:
    spark:    { min: 0.00, max: 0.20, label: "Spark",    description: "Just getting started" }
    ember:    { min: 0.20, max: 0.40, label: "Ember",    description: "Building heat" }
    flame:    { min: 0.40, max: 0.60, label: "Flame",    description: "Gaining momentum" }
    blaze:    { min: 0.60, max: 0.80, label: "Blaze",    description: "Seriously cooking" }
    inferno:  { min: 0.80, max: 0.95, label: "Inferno",  description: "Near mastery" }
    forged:   { min: 0.95, max: 1.00, label: "FORGED",   description: "Complete mastery" }

# -- Quiz Protocol --
quiz:
  style: "Tim Dillon comedian energy at 10x"
  emojis: true
  emojis_in_code: false
  question_format: "multiple_choice"
  options: ["A", "B", "C", "D"]
  special_options:
    E: "I don't know"
    F: "Question previous question"
  answer_format: "[letter][confidence 1-5]"
  answer_example: "B4"
  numbering: "cumulative_across_sessions"
  correct_answer_randomization: true
  max_same_letter_streak: 2
  stats_display: "after_every_question"
  full_dashboard: "every_10_questions"
  pause_commands:
    SIDEQUEST: "Pause quiz, answer question, resume"
    TIMEOUT: "Pause for meta/process discussion, resume"
    F: "Pin current question, allow discussion, resume with pinned question"

# -- Logging Pipeline --
logging:
  layer_1_forge:
    enabled: true
    tracks: ["quiz_answers", "confidence", "mastery", "error_patterns", "spaced_repetition"]
    scoring:
      correct_confident:   { confidence_min: 4, delta: "+0.20", signal: "strong" }
      correct_unsure:      { confidence_max: 3, delta: "+0.10", signal: "moderate" }
      incorrect_confident:  { confidence_min: 4, delta: "-0.15", signal: "misconception" }
      incorrect_unsure:     { confidence_max: 3, delta: "-0.05", signal: "expected_gap" }
    error_types: ["slip", "lapse", "mistake", "misconception"]

  layer_2_memories:
    enabled: true
    auto_remember:
      key_learnings: { category: "semantic", importance: 0.7 }
      aha_moments: { category: "episodic", importance: 0.8 }
      misconceptions: { category: "episodic", importance: 0.9 }
      workflow_patterns: { category: "procedural", importance: 0.7 }
      decisions: { category: "decision", importance: 0.7 }

  layer_3_progress_doc:
    enabled: true
    gdoc_id: "1r_N1zutOFBOcWdZHespSMb8NrB0Bwb-y0UVwO1OX4mQ"
    gdrive_folder: "Claude_Course"
    updates: ["module_completion", "mastery_scores", "domain_breakdown", "milestones"]

# -- Domains --
domains:
  - id: "1.0"
    name: "Foundations"
    weight: 0.25
    description: "Core CLI usage, settings, memory, and permissions"

  - id: "2.0"
    name: "Intermediate"
    weight: 0.25
    description: "Models, context, git, MCP, hooks, and sandboxing"

  - id: "3.0"
    name: "Advanced"
    weight: 0.25
    description: "Subagents, skills, SDK, remote, browser, plugins, and teams"

  - id: "4.0"
    name: "Expert"
    weight: 0.15
    description: "Enterprise config, CI/CD, cost optimization, debugging, and architecture"

  - id: "5.0"
    name: "Mastery"
    weight: 0.10
    description: "Building MCP servers, Agent SDK, vim mastery, and capstone"

